<style>

.rc h4{font:400 2rem var(--fh);letter-spacing:.04em;border-bottom:1px dashed var(--ink);padding-bottom:.4rem;margin-bottom:.5rem;text-transform:uppercase}

.rc .t{border-top:1px dashed var(--ink);margin-top:.5rem;padding-top:.5rem;font-weight:700;font-size:15px}
.rc .b{display:block;width:100%;text-align:center;margin-top:.8rem}
.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1.5rem;border-top:1.5px dashed var(--ink);padding-top:1rem}

.rc button{width:100%;margin-top:.8rem}
.tb{position:sticky;top:0;z-index:60;display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;background:var(--pa);border:1.5px solid var(--ink);padding:.5rem;margin-top:1rem}
.tb select,.tb input:not([type=file]){border:1.5px solid var(--ink);background:var(--bg);padding:.4rem .5rem;height:38px}
.tb input[type=color]{padding:2px;width:42px}.tb #nf{width:150px}
dialog{width:min(640px,92vw);background:var(--pa);color:var(--ink);border:1.5px solid var(--ink);padding:1.2rem}

#tt{position:fixed;bottom:1.2rem;left:50%;translate:-50% 0;background:var(--ink);color:var(--bg);padding:.7rem 1rem;z-index:99}
@media(max-width:760px){.mg,.g3{grid-template-columns:1fr}.f{grid-template-columns:30px 1fr}.fr{grid-column:1/-1}.rc{rotate:0deg}}
@media(prefers-reduced-motion:reduce){.fo,.stack{transition:none}.fo.pull{animation:none}}
</style></head><body>

<script>
/* ===== НАСТРОЙКА ===== */
/* Адрес вебхука из Make (модуль Webhooks → Custom webhook). Пароль админа здесь больше НЕ хранится — он проверяется в Make. */
const WEBHOOK_URL='https://hook.eu2.make.com/3bedlrb8hu6rnqw5njw7246c4uxv7ajt';
/* ===================== */
const tg=(window.Telegram&&Telegram.WebApp)||null;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#dde4ea');tg.setBackgroundColor('#dde4ea')}catch(e){}}
const TGU=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)||null;
const SID=(()=>{try{let s=sessionStorage.getItem('sid');if(!s){s=(TGU?TGU.id+'-':'')+Date.now().toString(36)+Math.random().toString(36).slice(2,8);sessionStorage.setItem('sid',s)}return s}catch(e){return 'x'+Math.random().toString(36).slice(2)}})();
const CKEY='archcalc_cfg',DKEY='archcalc_draft',UKEY='archcalc_u_'+(TGU?TGU.id:'guest');
const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)];
let n=0;const uid=()=>'i'+Date.now().toString(36)+(n++);
const F=t=>({id:uid(),title:t,note:'',price:0,over:null,on:true,imgs:[]});
const S=(t,f,tab)=>({id:uid(),title:t,tab,fields:f.map(F)});
const DEF=()=>({name:'Жилой дом',area:100,cur:'₽',email:'',texts:{},fonts:[],fd:[],sections:[
 S('Эскизный проект',['Планировка','Фасады'],'Эскиз'),
 S('АР — архитектурные решения',['Планировка','Фасады','Обмерный план','Разрезы'],'АР'),
 S('КР — конструктивные решения',['Планировка','Фасады'],'КР')]});
const SEED=(()=>{try{return JSON.parse(q('#seed').textContent)}catch(e){return null}})();
const TX={logo:'Архитектурная студия',kicker:'Предварительный расчёт',h1a:'Стоимость',h1b:'проекта',lead:'Отметьте нужные работы, укажите площадь — картотека посчитает стоимость каждого раздела. Цена за м² у каждой позиции своя.',h_main:'Общие сведения',lb_name:'Название проекта',lb_area:'Площадь, м²',lb_cur:'Валюта',r_title:'Смета',r_area:'площадь',r_total:'Итого',send:'Отправить расчёт',lb_price:'Цена за м²',lb_cost:'Стоимость',lb_sec:'Итого по разделу',tab0:'Проект',subject:'Расчёт стоимости проекта',title:'Расчёт стоимости проекта',sent:'Расчёт отправлен. Мы скоро свяжемся с вами.',client_msg:'Спасибо за заявку! Мы получили ваш расчёт и скоро свяжемся с вами.'};
const tx=k=>st.texts[k]!=null?st.texts[k]:TX[k];
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}};
const norm=c=>{c.fonts=c.fonts||[];c.fd=c.fd||[];c.texts=c.texts||{};delete c.pw;return c};
/* конфиг (разделы, цены, тексты) приходит из Make; здесь — кэш последней версии */
let st=norm((()=>{let b=lsGet(CKEY);if(!(b&&b.sections))b=null;if(SEED&&SEED.sections&&(!b||(b.pub||0)<(SEED.pub||0)))b=SEED;return b||DEF()})());
/* ввод клиента (название, площадь, галочки) хранится отдельно и не мешается с конфигом */
function applyUser(){const u=lsGet(UKEY);if(!u)return;if(u.name!=null)st.name=u.name;if(u.area!=null)st.area=u.area;
 if(u.on)st.sections.forEach(s=>s.fields.forEach(f=>{if(f.id in u.on)f.on=u.on[f.id]}))}
applyUser();
let A=0,edit=false,saved=null;
function toast(m){const t=document.createElement('div');t.id='tt';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4000)}
const save=()=>{const u={name:st.name,area:st.area,on:{}};st.sections.forEach(s=>s.fields.forEach(f=>u.on[f.id]=f.on!==false));
 if(!lsSet(UKEY,u)||(edit&&!lsSet(DKEY,st)))toast('В браузере не хватило места: уменьшите фото или файл шрифта')};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()||'Без названия'};
const X=(k,tag='span')=>`<${tag} class="rt" data-x="${k}" ${edit?'contenteditable':''}>${tx(k)}</${tag}>`;
function applyStatic(){qa('.top [data-x],.hero [data-x]').forEach(e=>{e.innerHTML=tx(e.dataset.x);e.toggleAttribute('contenteditable',edit)});document.title=tx('title')}
const sec=i=>st.sections.find(s=>s.id==i);
const fld=i=>{for(const s of st.sections){const f=s.fields.find(f=>f.id==i);if(f)return f}};
const amt=f=>f.over!=null?f.over:(+f.price||0)*(+st.area||0);
const amtOn=f=>f.on===false?0:amt(f);
const secSum=s=>s.fields.reduce((a,f)=>a+amtOn(f),0);
const total=()=>st.sections.reduce((a,s)=>a+secSum(s),0);
const adj=()=>+st.adjust||0;
const fmt=v=>Math.round(v).toLocaleString('ru-RU')+' '+st.cur;
const m2=v=>st.area>0?fmt(v/st.area)+' / м²':'';
const label=s=>s.tab||plain(s.title);
function addFont(f){if(f.d)q('#ff').textContent+=`@font-face{font-family:"${f.n}";src:url(${f.d})}`;else{const l=document.createElement('link');l.rel='stylesheet';l.dataset.dyn=1;l.href='https://fonts.googleapis.com/css2?family='+f.n.replace(/ /g,'+')+':wght@300;400;500;600&display=swap';document.head.append(l)}}
function loadFonts(){q('#ff').textContent='';qa('link[data-dyn]').forEach(e=>e.remove());st.fd.forEach(addFont);st.fonts.forEach(n=>addFont({n}))}
loadFonts();
const BASE=['Golos Text','Bebas Neue','Jost','Manrope','Oswald','Montserrat','Playfair Display','Cormorant Garamond','Arial','Georgia'];
const SYM=['°','±','²','³','⌀','∠','≥','≤','≈','×','‰','½','¼','↔','⊥','∥','м²','м³','№','Σ'];
const bc=s=>{let h=0,a=[],x=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;for(let i=0;i<34;i++){h=(h*1103515245+12345)>>>0;const w=1+(h>>16)%4,g=1+(h>>20)%3;a.push(`#151515 ${x}px ${x+w}px,transparent ${x+w}px ${x+w+g}px`);x+=w+g}return`linear-gradient(90deg,${a.join(',')})`};

const T={sec:i=>fmt(secSum(sec(i))),secm2:i=>m2(secSum(sec(i))),grand:()=>fmt(total()),grandm2:()=>m2(total())};
function upd(){
 qa('[data-t]').forEach(e=>{const[k,i]=e.dataset.t.split(':');e.textContent=T[k](i)});
 qa('[data-over]').forEach(e=>{const f=fld(e.dataset.over);e.classList.toggle('ov',f.over!=null);if(document.activeElement!==e)e.value=Math.round(amt(f))});
 qa('.f').forEach(e=>e.classList.toggle('off',fld(e.dataset.id).on===false));
}
const rich=(tag,cls,id,k,html,ph)=>`<div class="rt ${cls}" ${edit?'contenteditable':''} data-f="${id}" data-k="${k}" ${ph?`data-ph="${ph}"`:''}>${html}</div>`;
function mainCard(){return`<div class="mg"><div>${X('h_main','h2')}
<div class="g3"><label class="l">${X('lb_name')}<input class="in" data-p="name" value="${esc(st.name)}"></label>
<label class="l">${X('lb_area')}<input class="in" type="number" min="0" step="any" data-p="area" value="${esc(st.area)}"></label>
<label class="l">${X('lb_cur')}<input class="in" data-p="cur" maxlength="6" value="${esc(st.cur)}"></label></div>
${edit?`<div class="adm"><label class="l">Сообщение клиенту в чат (отправит Make)<input class="in" data-tx="client_msg" value="${esc(tx('client_msg'))}"></label><label class="l">Текст в приложении после отправки<input class="in" data-tx="sent" value="${esc(tx('sent'))}"></label><label class="l">Заголовок заявки<input class="in" data-tx="subject" value="${esc(tx('subject'))}"></label><label class="l">Заголовок вкладки браузера<input class="in" data-tx="title" value="${esc(tx('title'))}"></label><label class="l">Подпись ярлыка «Проект»<input class="in" data-tx="tab0" value="${esc(tx('tab0'))}"></label></div>`:''}</div>
<div class="rc"><h4>${X('r_title')}</h4><p><span>${esc(st.name)}</span></p><p>${X('r_area')}<span>${esc(st.area)} м²</span></p><hr style="border:0;border-top:1px dashed #2b2e33;margin:.4rem 0">
${st.sections.map(s=>`<p><span>${esc(label(s))}</span><span data-t="sec:${s.id}"></span></p>`).join('')}
<p class="t">${X('r_total')}<span data-t="grand"></span></p><p><span></span><span data-t="grandm2"></span></p>
${edit?`<div class="b">${X('send')}</div>`:`<button data-a="send">${tx('send')}</button>`}<i class="bc" style="background:${bc(st.name)}"></i></div></div>`}
function secCard(s){return`<div class="sh"><div>${edit?`<label class="l" style="max-width:220px;margin-bottom:.6rem">Подпись на ярлыке<input class="in" data-tab="${s.id}" value="${esc(label(s))}"></label>`:''}<h2 class="rt" ${edit?'contenteditable':''} data-s="${s.id}">${s.title}</h2></div>${edit?`<div class="ctl"><button class="o mini" data-a="delsec" data-v="${s.id}">Удалить раздел</button></div>`:''}</div>
${s.fields.map(f=>`<article class="f" data-id="${f.id}"><input class="ck" type="checkbox" data-on="${f.id}" ${f.on===false?'':'checked'} title="Включить в расчёт">
<div>${rich('div','ft',f.id,'title',f.title)}${edit||f.note?rich('div','fn',f.id,'note',f.note,'Описание, примечания…'):''}
<div class="imgs">${f.imgs.map((u,i)=>`<figure><img src="${u}" alt="">${edit?`<button data-a="delimg" data-f="${f.id}" data-v="${i}" title="Убрать">×</button>`:''}</figure>`).join('')}${edit?`<label class="addimg">+ изображение<input type="file" accept="image/*" hidden data-img="${f.id}"></label>`:''}</div></div>
<div class="fr"><label class="l">${X('lb_price')}<input class="in" type="number" min="0" step="any" data-price="${f.id}" value="${esc(f.price)}" ${edit?'':'disabled'}></label>
<div class="row"><label class="l">${X('lb_cost')}<input class="in big" type="number" min="0" step="any" data-over="${f.id}" ${edit?'':'disabled'}></label>${edit?`<button class="o mini" data-a="reset" data-f="${f.id}" title="Вернуть авторасчёт">↺</button>`:''}</div>
${edit?`<button class="o mini" data-a="delf" data-f="${f.id}">Удалить поле</button>`:''}</div></article>`).join('')}
${edit?`<button data-a="addf" data-v="${s.id}">+ добавить поле</button>`:''}
<div class="tot"><span class="fh" style="font-size:1.8rem">${X('lb_sec')}</span><span><small data-t="secm2:${s.id}"></small><b data-t="sec:${s.id}"></b></span></div>`}

function render(){
 q('#stack').innerHTML=['main'].concat(st.sections).map((s,i)=>`<div class="fo" data-i="${i}"><button class="tab" data-a="tab" data-v="${i}">${esc(s=='main'?tx('tab0'):label(s))}</button><div class="fb">${s=='main'?mainCard():secCard(s)}</div></div>`).join('');
 q('#tb').innerHTML=edit?`<div class="tb"><select id="ff2" title="Шрифт">${BASE.concat(st.fonts,st.fd.map(f=>f.n)).map(f=>`<option>${esc(f)}</option>`).join('')}</select><select id="fs" title="Размер">${[12,14,16,18,20,24,28,32,40,48].map(s=>`<option ${s==16?'selected':''}>${s}</option>`).join('')}</select><button class="o" data-c="bold"><b>Ж</b></button><button class="o" data-c="italic"><i>К</i></button><button class="o" data-c="underline"><u>Ч</u></button><input type="color" id="fc" value="#2b2e33" title="Цвет"><select id="sym"><option value="">Символ…</option>${SYM.map(s=>`<option>${s}</option>`).join('')}</select><input id="nf" placeholder="Google-шрифт"><button class="o" data-a="addfont">+</button><label class="b o">Файл шрифта<input type="file" accept=".ttf,.otf,.woff,.woff2" hidden id="ffile"></label><button class="o" data-a="addsec">+ раздел</button><button data-a="publish">Опубликовать</button><button class="o" data-a="export">Скачать HTML</button><button class="o" data-a="data">Данные</button></div>`:'';
 document.body.classList.toggle('ed',edit);applyStatic();q('#ed').textContent=edit?'готово':'править';q('#ed').classList.toggle('on-btn',edit);
 A=Math.min(A,st.sections.length);layout(A,false);upd();
}
const ro=new ResizeObserver(()=>setH());
function setH(){const fb=q('.fo.on .fb');if(!fb)return;const s=q('#stack'),h=fb.offsetHeight;s.style.height=h+'px';s.style.setProperty('--H',h+'px')}
function layout(prev,anim){
 const fos=qa('.fo'),N=fos.length,W=q('#stack').clientWidth,step=Math.min(170,(W-24)/N);let md=0;
 fos.forEach((el,i)=>{
  const d=Math.abs(i-A);md=Math.max(md,d);
  const tb=el.querySelector('.tab');tb.style.left=i*step+'px';tb.style.width=step-6+'px';
  el.classList.toggle('on',i==A);el.querySelector('.fb').inert=i!=A;
  el.style.setProperty('--f',-d*14+'px');
  el.style.transform=i==A?'':`translateY(${-d*14}px) scale(${1-.012*d})`;
  el.style.filter=i==A?'':`brightness(${1-.035*d})`;
  const z=50-d;
  if(anim&&(i==A||i==prev)&&prev!=A)setTimeout(()=>el.style.zIndex=z,300);else el.style.zIndex=z;
  if(anim&&i==A&&prev!=A&&!matchMedia('(prefers-reduced-motion:reduce)').matches){el.classList.remove('pull');void el.offsetWidth;el.classList.add('pull');el.onanimationend=()=>el.classList.remove('pull')}
 });
 q('#stack').style.marginTop=(46+md*14+12)+'px';
 const fb=q('.fo.on .fb');ro.disconnect();ro.observe(fb);setH();
}
addEventListener('resize',()=>layout(A,false));
/* editing */
document.addEventListener('selectionchange',()=>{const s=getSelection();if(!s.rangeCount)return;const nd=s.anchorNode,el=nd&&(nd.nodeType==1?nd:nd.parentElement);if(el&&el.closest('.rt[contenteditable]'))saved=s.getRangeAt(0).cloneRange()});
function sync(el){const d=el.dataset;if(d.s)sec(d.s).title=el.innerHTML;else if(d.x){st.texts[d.x]=el.innerHTML;qa('[data-x="'+d.x+'"]').forEach(e=>{if(e!==el)e.innerHTML=el.innerHTML})}else fld(d.f)[d.k]=el.innerHTML;save()}
function ex(cmd,val,px){
 if(!saved)return;const s=getSelection();s.removeAllRanges();s.addRange(saved);
 document.execCommand('styleWithCSS',false,true);document.execCommand(cmd,false,val);
 if(px)qa('.rt [style*="xxx-large"]').forEach(e=>e.style.fontSize=px+'px');
 const nd=getSelection().anchorNode,el=nd&&(nd.nodeType==1?nd:nd.parentElement).closest('.rt');if(el)sync(el);
}
document.addEventListener('mousedown',e=>{if(e.target.closest('.tb button'))e.preventDefault()});
let unlocked=false,fails=0,token=null;
async function call(action,data){
 if(!WEBHOOK_URL)throw new Error('nowebhook');
 const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),30000);
 try{const r=await fetch(WEBHOOK_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
   body:JSON.stringify({action,sessionId:SID,initData:tg?tg.initData:'',user:TGU,...data})});
  const j=await r.json().catch(()=>null);return j||{ok:r.ok}}finally{clearTimeout(t)}}
const notify=m=>{if(tg&&tg.initData){try{return tg.showAlert(m)}catch(e){}}toast(m)};
const netErr=e=>toast(e&&e.message=='nowebhook'?'Не задан WEBHOOK_URL в коде':'Нет связи с сервером');
function askPw(t){return new Promise(res=>{const d=q('#pwd'),i=q('#pwi');q('#pwt').textContent=t;i.value='';let v=null;const done=x=>{v=x;d.close()};q('#pwok').onclick=()=>done(i.value);q('#pwc').onclick=()=>done(null);i.onkeydown=e=>{if(e.key=='Enter')done(i.value)};d.onclose=()=>res(v);d.showModal();i.focus()})}
q('#ed').onclick=async()=>{if(edit){edit=false;render();return}
 if(!unlocked){const p=await askPw('Введите пароль для редактирования');if(p===null)return;
  const b=q('#ed');b.disabled=true;let r;
  try{r=await call('auth',{password:p})}catch(e){b.disabled=false;return netErr(e)}
  b.disabled=false;
  if(!r||!r.ok||!r.token){fails++;await new Promise(r=>setTimeout(r,Math.min(5000,600*fails)));return toast('Неверный пароль')}
  token=r.token;unlocked=true;fails=0;
  const d=lsGet(DKEY);if(d&&d.sections&&d.pub===st.pub){st=norm(d);loadFonts();toast('Загружен несохранённый черновик')}}
 edit=true;render()};
async function publish(b){
 if(!token)return toast('Сначала войдите как администратор');
 const old=st.pub;st.pub=Date.now();
 if(JSON.stringify(st).length>4.5e6){st.pub=old;return toast('Слишком много данных — уменьшите фото или файл шрифта')}
 b.disabled=true;
 try{const r=await call('save_config',{token,config:JSON.stringify(st)});
  if(r.ok){try{localStorage.removeItem(DKEY)}catch(e){};lsSet(CKEY,st);toast('Опубликовано')}
  else{st.pub=old;if(r.error=='auth'){token=null;unlocked=false;edit=false;render();toast('Сессия истекла — войдите заново')}else toast('Сервер отклонил сохранение')}}
 catch(e){st.pub=old;netErr(e)}finally{b.disabled=false}}
async function sendCalc(b){
 const L=[st.name+' — '+st.area+' м²',''];
 const secs=st.sections.map(s=>{L.push(plain(s.title)+': '+fmt(secSum(s)));
  const fs=s.fields.filter(f=>f.on!==false);fs.forEach(f=>L.push('  — '+plain(f.title)+': '+fmt(amt(f))));
  return{title:plain(s.title),sum:Math.round(secSum(s)),fields:fs.map(f=>({title:plain(f.title),amount:Math.round(amt(f))}))}});
 L.push('',plain(tx('r_total'))+': '+fmt(total()));
 b.disabled=true;
 try{const r=await call('submit',{subject:tx('subject'),clientMsg:tx('client_msg'),text:L.join('\n'),
   calc:{name:st.name,area:+st.area||0,cur:st.cur,total:Math.round(total()),sections:secs}});
  if(r.ok===false)throw 0;notify(tx('sent'))}
 catch(e){e===0||(e&&e.message=='nowebhook')?netErr(e||{}):toast('Не удалось отправить. Попробуйте ещё раз')}
 finally{b.disabled=false}}
function exportSite(){st.pub=Date.now();save();const c=document.documentElement.cloneNode(true);
 c.querySelector('#seed').textContent=JSON.stringify(st).replace(/</g,'\\u003c');
 ['#stack','#tb','#ff'].forEach(s=>c.querySelector(s).innerHTML='');c.querySelector('#stack').removeAttribute('style');
 c.querySelectorAll('[data-dyn],#tt').forEach(e=>e.remove());c.querySelector('body').removeAttribute('class');
 c.querySelector('#ed').textContent='править';c.querySelector('#ed').className='o';c.querySelector('#ta').textContent='';
 c.querySelector('title').textContent=tx('title');c.querySelectorAll('[contenteditable]').forEach(e=>e.removeAttribute('contenteditable'));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['<!DOCTYPE html>\n'+c.outerHTML],{type:'text/html'}));a.download='index.html';a.click()}
document.addEventListener('click',e=>{
 if(e.target.closest('.rt[contenteditable]')&&e.target.closest('label,button'))e.preventDefault();
 const c=e.target.closest('[data-c]');if(c)return ex(c.dataset.c);
 const b=e.target.closest('[data-a]');if(!b)return;
 const a=b.dataset.a,v=b.dataset.v,f=b.dataset.f;
 const arm=()=>{if(b.dataset.armed)return true;b.dataset.armed=1;const o=b.textContent;b.textContent='Нажмите ещё раз';setTimeout(()=>{delete b.dataset.armed;b.textContent=o},3000);return false};
 if(a=='tab'){const p=A;A=+v;if(p!=A)layout(p,true)}
 else if(a=='send')sendCalc(b);
 else if(a=='publish')publish(b);
 else if(a=='export')exportSite();
 else if(a=='addsec'){const s=S('Новый раздел',['Поле 1'],'Новый');st.sections.push(s);A=st.sections.length;save();render()}
 else if(a=='delsec'){if(!arm())return;st.sections=st.sections.filter(s=>s.id!=v);A=0;save();render()}
 else if(a=='addf'){sec(v).fields.push(F('Новое поле'));save();render()}
 else if(a=='delf'){if(!arm())return;const s=st.sections.find(s=>s.fields.some(x=>x.id==f));s.fields=s.fields.filter(x=>x.id!=f);save();render()}
 else if(a=='delimg'){fld(f).imgs.splice(+v,1);save();render()}
 else if(a=='reset'){fld(f).over=null;save();upd()}
 else if(a=='addfont'){const nm=q('#nf').value.trim();if(nm&&![...BASE,...st.fonts].includes(nm)){st.fonts.push(nm);addFont({n:nm});save();render()}}
 else if(a=='data'){q('#ta').value=JSON.stringify(st);q('#dlg').showModal()}
});
q('#cls').onclick=()=>q('#dlg').close();
q('#imp').onclick=()=>{try{const d=JSON.parse(q('#ta').value);if(!d.sections)throw 0;st=d;st.texts=st.texts||{};norm(st);loadFonts();A=0;save();render();q('#dlg').close()}catch(e){q('#ta').value='Не удалось прочитать данные — вставьте полный текст копии.'}};
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;
 if(t.classList&&t.classList.contains('rt'))return sync(t);
 if(d.p)st[d.p]=t.value;
 else if(d.tx){st.texts[d.tx]=t.value;if(d.tx=='title')document.title=t.value;if(d.tx=='tab0')qa('.tab')[0].textContent=t.value}
 else if(d.price)fld(d.price).price=t.value;
 else if(d.over)fld(d.over).over=t.value===''?null:+t.value;
 else if(d.tab){sec(d.tab).tab=t.value;const i=st.sections.findIndex(s=>s.id==d.tab)+1;qa('.tab')[i].textContent=t.value}
 else return;
 save();upd();
});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.closest&&e.target.closest('[data-x][contenteditable]'))e.preventDefault()});
document.addEventListener('paste',e=>{if(!(e.target.closest&&e.target.closest('.rt[contenteditable]')))return;e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))});
document.addEventListener('change',e=>{
 const t=e.target,d=t.dataset;
 if(d.on){fld(d.on).on=t.checked;save();upd()}
 else if(t.id=='ff2')ex('fontName',t.value);
 else if(t.id=='fs')ex('fontSize',7,+t.value);
 else if(t.id=='fc')ex('foreColor',t.value);
 else if(t.id=='sym'){if(t.value)ex('insertText',t.value);t.value=''}
 else if(t.id=='ffile'&&t.files[0]){const f=t.files[0],R=new FileReader;R.onload=()=>{const o={n:f.name.replace(/\.[^.]+$/,'').replace(/[^\wа-яё -]/gi,'').slice(0,30)||'Мой шрифт',d:R.result};st.fd=st.fd.filter(x=>x.n!=o.n);st.fd.push(o);addFont(o);save();render()};R.readAsDataURL(f)}
 else if(d.img&&t.files[0]){
  const R=new FileReader;R.onload=()=>{const im=new Image;im.onload=()=>{const k=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);fld(d.img).imgs.push(c.toDataURL('image/jpeg',.82));save();render()};im.src=R.result};R.readAsDataURL(t.files[0]);
 }
});
render();
function applyRemote(c){
 if(typeof c=='string'){try{c=JSON.parse(c)}catch(e){return}}
 if(!c||!c.sections||(c.pub||0)===(st.pub||0))return;
 st=norm(c);lsSet(CKEY,st);applyUser();loadFonts();A=0;render()}
(async()=>{try{const r=await call('init',{startParam:(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||'',pub:st.pub||0});
 if(r&&r.ok&&r.config&&!edit)applyRemote(r.config)}catch(e){}})();
</script></body></html>
